<main class="container my-5">
  <h1 class="mb-4">Contact Us</h1>
  <p class="mb-4">Have questions or need support? Fill out the form and we’ll get back to you within 1-2 business days.</p>

  <form action="#" method="post" class="row g-3">
    <div class="col-md-6">
      <label for="firstName" class="form-label">First Name</label>
      <input type="text" class="form-control" id="firstName" name="firstName" placeholder="name" required>
    </div>
    <div class="col-md-6">
      <label for="lastName" class="form-label">Last Name</label>
      <input type="text" class="form-control" id="lastName" name="lastName" placeholder="last name " required>">
    </div>
    <div class="col-md-6">
      <label for="email" class="form-label">Email</label>
      <input type="email" class="form-control" id="email" name="email" placeholder="name@example.com" required>
    </div>
    <div class="col-md-6">
      <label for="phone" class="form-label">Phone</label>
      <input type="tel" class="form-control" id="phone" name="phone" placeholder="+91 12345 67890" required>
    </div>
    <div class="col-12">
      <label for="subject" class="form-label">Subject</label>
      <input type="text" class="form-control" id="subject" name="subject" placeholder="How can we help?" required>
    </div>
    <div class="col-12">
      <label for="message" class="form-label">Message</label>
      <textarea class="form-control" id="message" name="message" rows="6" placeholder="Type your message here" required></textarea>
    </div>
    <div class="col-12">                                                                                                                
      <button type="submit" class="btn btn-primary">Send Message</button>
        <button type="reset" class="btn btn-secondary ms-2">Clear</button>
        </div>
  </form>
</main>
